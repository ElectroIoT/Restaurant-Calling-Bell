; Calling bell firmware. Step 1: radio link test on Arduino Nano boards.
; Build/upload one board at a time:  pio run -e link_tx -t upload   /   pio run -e link_rx -t upload
; Serial monitor: pio device monitor -b 115200

[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = nrf24/RF24@^1.4.9
build_flags = -Icommon

[env:link_tx]
build_src_filter = -<*> +<../link_test/tx.cpp>

[env:link_rx]
build_src_filter = -<*> +<../link_test/rx.cpp>
